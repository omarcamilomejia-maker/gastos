<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Salud">
<link rel="manifest" href="manifest.webmanifest">
<title>Salud</title>
<style>
:root{color-scheme:light;--bg:#f6f8f7;--surface:#fff;--ink:#11201a;--ink2:#52625b;--rule:#d7e0db;--acc:#0b6b4d;--acc-t:#d6ede2;--on:#fff;--key:#e9eeeb;
  --s1:#2a78d6;--s2:#eb6834;--crit:#c2362f;--grid:#e1e6e3;}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#0f1713;--surface:#16211c;--ink:#e4ede8;--ink2:#9db1a8;--rule:#26352f;--acc:#3fd39c;--acc-t:#133a2c;--on:#06110c;--key:#1c2924;--s1:#3987e5;--s2:#d95926;--crit:#ef6a62;--grid:#26352f;}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
.wrap{max-width:560px;margin:0 auto;padding:calc(10px + env(safe-area-inset-top)) 14px 0}
h1{font-size:1.15rem;margin:.2rem 0 .6rem}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:1rem;padding:.85rem;margin-bottom:10px}
h2{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--ink2);margin:0 0 .5rem}
label{display:block;font-size:.76rem;color:var(--ink2);margin:.5rem 0 .15rem}
input,textarea{width:100%;font:inherit;padding:.6rem .7rem;border:1px solid var(--rule);border-radius:.7rem;background:var(--bg);color:var(--ink)}
textarea{min-height:64px;resize:vertical}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.btns{display:flex;flex-wrap:wrap;gap:6px}
.b{border:1px solid var(--rule);background:var(--surface);border-radius:.7rem;padding:.5rem .7rem;font-size:.85rem;cursor:pointer;color:var(--ink)}
.b.on{background:var(--acc-t);border-color:var(--acc);color:var(--acc);font-weight:650}
.save{width:100%;border:0;background:var(--acc);color:var(--on);border-radius:.9rem;padding:.8rem;font-size:1rem;font-weight:700;margin-top:.7rem;cursor:pointer}
.save.sec{background:var(--key);color:var(--ink)}
.msg{font-size:.85rem;margin-top:.5rem;min-height:1.2em}.msg.err{color:var(--crit)}
.tabs{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-top:1px solid var(--rule);padding:6px 0 calc(8px + env(safe-area-inset-bottom))}
.tabs button{border:0;background:none;color:var(--ink2);font-size:.72rem;padding:.3rem;cursor:pointer}.tabs button b{display:block;font-size:1.15rem;font-weight:500}
.tabs .on{color:var(--acc);font-weight:700}
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:8px}.kpi div{background:var(--bg);border-radius:.7rem;padding:.55rem .7rem}
.kpi small{color:var(--ink2);font-size:.72rem;display:block}.kpi b{font-size:1.35rem;letter-spacing:-.01em}
svg{width:100%;height:auto;display:block}svg text{fill:var(--ink2);font:10.5px system-ui,sans-serif}
.leg{display:flex;gap:.9rem;font-size:.76rem;color:var(--ink2);margin:.2rem 0 .3rem}.leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:.3rem}
.pg{display:none}.pg.on{display:block}
.prev{max-width:100%;border-radius:.6rem;margin-top:.4rem;display:none}
.bar{height:9px;background:var(--rule);border-radius:5px;overflow:hidden;margin:.2rem 0 .5rem}.bar i{display:block;height:100%;background:var(--acc)}
.row{display:flex;justify-content:space-between;font-size:.88rem}
</style>
</head>
<body>
<div class="wrap">
<h1 id="ttl">Salud</h1>

<section class="pg on" id="pg-hoy">
  <div class="card"><h2>Medidas de hoy</h2>
    <div class="g2"><div><label for="peso">Peso (kg)</label><input id="peso" type="number" inputmode="decimal" step="0.1" placeholder="88,0"></div>
      <div><label for="spin">Spinning (min)</label><input id="spin" type="number" inputmode="numeric" placeholder="45"></div></div>
    <div class="g3"><div><label for="sis">Sistólica</label><input id="sis" type="number" inputmode="numeric" placeholder="120"></div>
      <div><label for="dia">Diastólica</label><input id="dia" type="number" inputmode="numeric" placeholder="80"></div>
      <div><label for="pul">Pulso</label><input id="pul" type="number" inputmode="numeric" placeholder="70"></div></div>
    <label>Energía</label><div class="btns" id="ene"></div>
    <button class="save" id="gm">Guardar medidas</button><div class="msg" id="mm"></div></div>

  <div class="card"><h2>Comida</h2>
    <div class="btns" id="cms"></div>
    <label for="desc">¿Qué comió?</label><textarea id="desc" placeholder="Ej: pechuga a la plancha, arroz integral, ensalada"></textarea>
    <label>¿Siguió el recetario?</label><div class="btns" id="rec"></div>
    <label>Foto (opcional)</label>
    <input id="foto" type="file" accept="image/*" capture="environment">
    <img class="prev" id="prev" alt="Vista previa de la foto">
    <button class="save" id="gc">Guardar comida</button><div class="msg" id="mc"></div></div>
</section>

<section class="pg" id="pg-tend">
  <div class="card"><h2>Peso</h2>
    <div class="leg"><span><i style="background:var(--s1)"></i>Peso</span><span><i style="background:var(--s2)"></i>Promedio 7 días</span><span><i style="background:var(--ink2)"></i>Meta</span></div>
    <div id="ch-peso"></div></div>
  <div class="card"><h2>Presión</h2>
    <div class="leg"><span><i style="background:var(--s1)"></i>Sistólica</span><span><i style="background:var(--s2)"></i>Diastólica</span></div>
    <div id="ch-pres"></div></div>
</section>

<section class="pg" id="pg-sem">
  <div class="card"><h2>Hacia la meta</h2><div class="kpi" id="kpi"></div><div id="meta"></div></div>
  <div class="card"><h2>Últimos 7 días</h2><div id="sem"></div></div>
</section>

<section class="pg" id="pg-cfg">
  <div class="card"><h2>Conexión (se guarda solo en este teléfono)</h2>
    <label for="url">URL del Apps Script de Salud (/exec)</label>
    <input id="url" type="url" autocapitalize="off" autocorrect="off" spellcheck="false">
    <label for="llave">Llave de Salud</label>
    <input id="llave" type="password" autocapitalize="off" autocorrect="off" spellcheck="false">
    <button class="save" id="gcfg">Guardar</button>
    <button class="save sec" id="ping">Probar conexión</button><div class="msg" id="mcfg"></div></div>
</section>
</div>

<nav class="tabs"><button class="on" data-t="hoy"><b>＋</b>Hoy</button><button data-t="tend"><b>↘</b>Tendencia</button><button data-t="sem"><b>▤</b>Semana</button><button data-t="cfg"><b>⚙</b>Conexión</button></nav>

<script>
const $=id=>document.getElementById(id);
const rd=k=>{try{return localStorage.getItem(k)||""}catch(e){return ""}};
const wr=(k,v)=>{try{localStorage.setItem(k,v);return true}catch(e){return false}};
const COMIDAS=[["desayuno","Desayuno"],["media_manana","Media mañana"],["almuerzo","Almuerzo"],["merienda","Merienda"],["cena","Cena"],["extra","Extra"]];
const ERR={llave:"Llave incorrecta",limite:"Demasiadas peticiones, espere un momento",fecha:"Fecha inválida",vacio:"Escriba al menos un dato",
  presion:"Revise la presión: sistólica mayor que diastólica",peso_kg:"Peso fuera de rango",pulso:"Pulso fuera de rango",spinning_min:"Minutos fuera de rango",
  comida:"Elija la comida",descripcion:"Escriba qué comió",foto:"No se pudo leer la foto",foto_grande:"La foto es muy grande",ocupado:"Ocupado, reintente"};
let comida="",rec="",ene="",fotoB64="";

function btns(id,items,get,set){ // items: [[valor,etiqueta]]
  const el=$(id);el.innerHTML=items.map(([v,t])=>`<button type="button" class="b ${get()===v?"on":""}" data-v="${v}">${t}</button>`).join("");
  el.onclick=e=>{const b=e.target.closest("[data-v]");if(!b)return;set(get()===b.dataset.v?"":b.dataset.v);btns(id,items,get,set)};
}
const pintaBtns=()=>{btns("cms",COMIDAS,()=>comida,v=>comida=v);btns("rec",[["si","Sí"],["no","No"]],()=>rec,v=>rec=v);btns("ene",[1,2,3,4,5].map(n=>[String(n),String(n)]),()=>ene,v=>ene=v)};
pintaBtns();

function cfg(){return{url:rd("sl_url").trim(),llave:rd("sl_llave").trim()}}
function msg(id,t,err){const m=$(id);m.textContent=t;m.className="msg"+(err?" err":"")}
const nuevoId=p=>p+"-"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const hoyIso=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};

async function post(obj){
  const c=cfg();if(!c.url||!c.llave)throw new Error("Configure la conexión primero");
  const r=await fetch(c.url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(Object.assign({llave:c.llave},obj))});
  const j=await r.json();if(!j.ok)throw new Error(ERR[j.error]||("Error: "+j.error));return j;
}
async function get(accion){
  const c=cfg();if(!c.url||!c.llave)throw new Error("Configure la conexión primero");
  const r=await fetch(c.url+"?accion="+accion+"&llave="+encodeURIComponent(c.llave));
  const j=await r.json();if(!j.ok)throw new Error(ERR[j.error]||("Error: "+j.error));return j;
}
const num=id=>{const v=$(id).value.replace(",",".").trim();return v===""?undefined:Number(v)};

$("gm").onclick=async()=>{
  const o={accion:"salud_medida",id:nuevoId("sm"),fecha:hoyIso(),peso_kg:num("peso"),spinning_min:num("spin"),presion_sis:num("sis"),presion_dia:num("dia"),pulso:num("pul"),energia_1a5:ene?Number(ene):undefined};
  msg("mm","Guardando...");
  try{await post(o);msg("mm","Guardado ✓");["peso","spin","sis","dia","pul"].forEach(i=>$(i).value="");ene="";pintaBtns();cache=null}
  catch(e){msg("mm",e.message,true)}
};
$("foto").onchange=async e=>{
  const f=e.target.files[0];if(!f){fotoB64="";$("prev").style.display="none";return}
  try{fotoB64=await comprimir(f);$("prev").src="data:image/jpeg;base64,"+fotoB64;$("prev").style.display="block";msg("mc","Foto lista ("+Math.round(fotoB64.length*.75/1024)+" KB)")}
  catch(err){fotoB64="";msg("mc","No se pudo leer la foto",true)}
};
function comprimir(file){return new Promise((ok,ko)=>{const img=new Image(),u=URL.createObjectURL(file);
  img.onload=()=>{const k=Math.min(1,1280/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);const s=c.toDataURL("image/jpeg",.7).split(",")[1];s?ok(s):ko()};
  img.onerror=()=>ko();img.src=u})}
$("gc").onclick=async()=>{
  if(!comida)return msg("mc","Elija la comida",true);
  const o={accion:"salud_comida",id:nuevoId("sc"),fecha:hoyIso(),comida:comida,descripcion:$("desc").value,siguio_recetario:rec||undefined};
  if(fotoB64)o.foto_b64=fotoB64;
  msg("mc","Guardando...");
  try{await post(o);msg("mc","Guardado ✓"+(fotoB64?" con foto":""));$("desc").value="";comida="";rec="";fotoB64="";$("foto").value="";$("prev").style.display="none";pintaBtns();cache=null}
  catch(e){msg("mc",e.message,true)}
};
$("gcfg").onclick=()=>{msg("mcfg",wr("sl_url",$("url").value.trim())&&wr("sl_llave",$("llave").value.trim())?"Guardado en este teléfono":"No se pudo guardar",false)};
$("ping").onclick=async()=>{msg("mcfg","Probando...");try{const t=performance.now();await get("ping");msg("mcfg","Conexión correcta ("+Math.round(performance.now()-t)+" ms)")}catch(e){msg("mcfg",e.message,true)}};
$("url").value=rd("sl_url");$("llave").value=rd("sl_llave");

/* Tendencia y semana */
let cache=null;
async function datos(){if(!cache)cache=await get("salud_resumen");return cache}
const f1=n=>n===null||n===undefined?"—":String(n).replace(".",",");
function linea(el,series,opts){ // series:[{pts:[[x,y]],color,dash,puntos}]
  const W=Math.max(el.clientWidth,300),H=200,L=34,R=8,T=8,B=22;
  const xs=series.flatMap(s=>s.pts.map(p=>p[0])),ys=series.flatMap(s=>s.pts.map(p=>p[1]));
  if(!xs.length){el.innerHTML='<div class="msg">Aún no hay datos.</div>';return}
  let x0=Math.min(...xs),x1=Math.max(...xs);if(x1===x0)x1=x0+1;
  let y0=Math.floor(Math.min(...ys)-1),y1=Math.ceil(Math.max(...ys)+1);if(opts.minY!==undefined)y0=Math.min(y0,opts.minY);
  const X=x=>L+(x-x0)/(x1-x0)*(W-L-R),Y=y=>T+(1-(y-y0)/(y1-y0))*(H-T-B);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${opts.aria}">`;
  for(let k=0;k<=4;k++){const v=y0+(y1-y0)*k/4,y=Y(v);s+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="var(--grid)"/><text x="${L-4}" y="${y+3}" text-anchor="end">${Math.round(v)}</text>`}
  const dd=n=>{const d=new Date(n*864e5);return d.getUTCDate()+"/"+(d.getUTCMonth()+1)};
  [x0,(x0+x1)/2,x1].forEach((x,i)=>{s+=`<text x="${X(x)}" y="${H-6}" text-anchor="${i===0?"start":i===2?"end":"middle"}">${dd(Math.round(x))}</text>`});
  series.forEach(se=>{
    if(se.pts.length>1)s+=`<polyline points="${se.pts.map(p=>X(p[0])+","+Y(p[1])).join(" ")}" fill="none" stroke="${se.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" ${se.dash?'stroke-dasharray="5 4"':""}/>`;
    if(se.puntos)se.pts.forEach(p=>{s+=`<circle cx="${X(p[0])}" cy="${Y(p[1])}" r="3.2" fill="${se.color}" stroke="var(--surface)" stroke-width="1.5"><title>${p[2]||""}</title></circle>`});
  });
  el.innerHTML=s+"</svg>";
}
const di=s=>{const p=s.split("-").map(Number);return Math.floor(Date.UTC(p[0],p[1]-1,p[2])/864e5)};
async function tendencia(){
  try{const r=await datos();
    const sp=r.serie_peso;
    linea($("ch-peso"),[
      {pts:[[di(sp.length?sp[0].f:hoyIso()),r.meta.meta_kg],[di(hoyIso()),r.meta.meta_kg]],color:"var(--ink2)",dash:true},
      {pts:sp.map(p=>[di(p.f),p.mm7,p.f+": promedio "+f1(p.mm7)]),color:"var(--s2)"},
      {pts:sp.map(p=>[di(p.f),p.peso,p.f+": "+f1(p.peso)+" kg"]),color:"var(--s1)",puntos:true}],{aria:"Peso con promedio móvil y meta",minY:r.meta.meta_kg});
    const pr=r.serie_presion;
    linea($("ch-pres"),[{pts:pr.map(p=>[di(p.f),p.sis,p.f+": "+p.sis+"/"+p.dia]),color:"var(--s1)",puntos:true},{pts:pr.map(p=>[di(p.f),p.dia,p.f+": "+p.sis+"/"+p.dia]),color:"var(--s2)",puntos:true}],{aria:"Presión sistólica y diastólica"});
  }catch(e){$("ch-peso").innerHTML='<div class="msg err">'+e.message+"</div>"}
}
async function semana(){
  try{const r=await datos(),m=r.meta;
    $("kpi").innerHTML=`<div><small>Último peso</small><b>${f1(r.ultimo_peso)} kg</b></div><div><small>Promedio 7 días</small><b>${f1(r.promedio_movil_7d)} kg</b></div>
     <div><small>Bajados</small><b>${f1(r.kg_bajados)} kg</b></div><div><small>Faltan</small><b>${f1(r.kg_faltan)} kg</b></div>
     <div><small>Ritmo semanal</small><b>${f1(r.ritmo_semanal_kg)} kg</b></div><div><small>IMC</small><b>${f1(r.imc)}</b></div>`;
    const tot=m.peso_inicial-m.meta_kg,pct=tot>0?Math.max(0,Math.min(100,r.kg_bajados/tot*100)):0;
    $("meta").innerHTML=`<div class="bar"><i style="width:${pct}%"></i></div><div class="row"><span>${m.peso_inicial} kg</span><span>${Math.round(pct)}% del camino</span><span>${m.meta_kg} kg</span></div>`;
    const prs=r.presion_prom_7d;
    $("sem").innerHTML=`<div class="row"><span>Días con spinning</span><b>${r.dias_spinning_7d} de ${m.spinning_semana_meta} (meta semanal)</b></div><div class="bar"><i style="width:${Math.min(100,r.dias_spinning_7d/m.spinning_semana_meta*100)}%"></i></div>
     <div class="row"><span>Días siguiendo el recetario</span><b>${r.dias_recetario_7d} de 7</b></div><div class="bar"><i style="width:${r.dias_recetario_7d/7*100}%"></i></div>
     <div class="row"><span>Días con registro</span><b>${r.dias_con_registro_7d} de 7</b></div><div class="bar"><i style="width:${r.dias_con_registro_7d/7*100}%"></i></div>
     <div class="row"><span>Presión promedio</span><b>${prs?prs.sis+"/"+prs.dia+" ("+prs.n+" medidas)":"—"}</b></div>
     <div class="row"><span>Kcal promedio (estimadas por el asesor)</span><b>${r.kcal_prom_7d===null?"—":r.kcal_prom_7d+" de "+m.kcal_objetivo}</b></div>`;
  }catch(e){$("kpi").innerHTML='<div class="msg err">'+e.message+"</div>"}
}
document.querySelector(".tabs").onclick=e=>{const b=e.target.closest("[data-t]");if(!b)return;
  document.querySelectorAll(".tabs button").forEach(x=>x.classList.toggle("on",x===b));
  document.querySelectorAll(".pg").forEach(p=>p.classList.toggle("on",p.id==="pg-"+b.dataset.t));
  if(b.dataset.t==="tend")tendencia();if(b.dataset.t==="sem")semana()};
if(!cfg().url){document.querySelector('[data-t="cfg"]').click()}
</script>
</body>
</html>
