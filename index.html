<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#16304f">
<title>Ocarisa Group</title>
<style>
:root{color-scheme:light dark;--bg:#eef1f5;--ink:#16202c;--ink2:#566474;--a:#16304f;--b:#1f6a9f}
@media(prefers-color-scheme:dark){:root{--bg:#10171f;--ink:#e8edf3;--ink2:#9aa9bb}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:24px;box-sizing:border-box}
main{width:100%;max-width:420px;text-align:center}
h1{font-size:1.6rem;margin:0 0 .3rem}p{color:var(--ink2);margin:0 0 1.4rem}
a{display:block;text-decoration:none;color:#fff;font-weight:700;font-size:1.05rem;padding:1.1rem;border-radius:1rem;margin:.7rem 0}
a.g{background:var(--a)}a.s{background:var(--b)}
small{display:block;color:var(--ink2);margin-top:1.2rem}
</style>
</head>
<body>
<main>
  <h1>Ocarisa Group</h1>
  <p>Elija la aplicación</p>
  <a class="g" href="/gastos/gastos/">Ocarisa Expenses<br><span style="font-weight:400;font-size:.85rem">Control de gastos</span></a>
  <a class="s" href="/gastos/salud/">Ocarisa Health &amp; Wellness<br><span style="font-weight:400;font-size:.85rem">Salud y bienestar</span></a>
  <small id="m"></small>
</main>
<script>
// Si ya usó una de las apps, entra directo a la última. Para elegir otra, abra esta página con ?elegir
try{
  var u=localStorage.getItem("ocarisa_ult");
  if(u&&/^\/gastos\/(gastos|salud)\/$/.test(u)&&location.search.indexOf("elegir")<0){location.replace(u)}
  else document.getElementById("m").textContent="Si instaló un acceso directo viejo, ya puede usar este.";
}catch(e){}
</script>
</body>
</html>
